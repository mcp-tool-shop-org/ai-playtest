# CI — typecheck + tests + emit/pack shape + dependency audit.
#
# Trigger scoping (studio GitHub Actions rules):
#   `push` is filtered to `main` ONLY. A tag push matches no branch filter, and a
#   feature-branch push leaves just the `pull_request` event — so one commit
#   cannot pay for two matrices. A concurrency group cannot fix that on its own,
#   because push sees refs/heads/<branch> while the PR sees refs/pull/N/merge.
#   `pull_request` deliberately carries NO `branches:` filter — that would filter
#   the PR's *base* branch, not its head.
#   Accepted cost: a branch with no open PR gets no automatic run. Use the
#   workflow_dispatch fallback.
#
# Cost: one job, one matrix cell, ubuntu-latest. The suite is ~2 s of vitest plus
# install; per-push cost is dominated by setup, not tests. Measure with
# `gh api repos/mcp-tool-shop-org/ai-playtest/actions/runs/<id>/jobs` and record
# the real number here once a run exists — never estimate it.
# Measured per-push cost: 34s, one job, ubuntu-latest (run 34919…, `gh api
# repos/mcp-tool-shop-org/ai-playtest/actions/runs/<id>/jobs`). Install and
# setup dominate; the vitest suite itself is ~6s. Re-measure if a second matrix
# cell or a second full-suite leg is ever added — that is the shape that turned
# one repo into 44% of the org's Actions minutes.
#
# No-duplicate-run check (group by head SHA; reading the YAML proves nothing):
#   gh run list --workflow=ci.yml --limit 30 --json event,headBranch,headSha \
#     --jq 'group_by(.headSha)|map(select(length>1))|.[]|"\(.[0].headSha[0:8]): "
#           + ([.[]|"\(.event)@\(.headBranch)"]|join(" + "))'
# Verified empty across the swarm's commits.

name: CI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/**'
      - 'atlas/**'
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vitest.config.ts'
      - '.github/workflows/**'
      - 'atlas/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SHA-pinned Node 24 action runtime. Job node-version stays 20 (engines floor).
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Atlas needs Node 22 or later and this job holds Node 20 (the engines
      # floor), so the check gets its own Node before the job's setup-node,
      # which then puts Node 20 back on PATH for everything after it.
      - name: Set up Node for the Atlas check
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.20.0 check

      # Node 20 is the floor declared in package.json engines. One cell holds
      # that floor honestly; the author develops on 22, so this is the version
      # that would otherwise go unverified.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Verify (typecheck + tests)
        run: npm run verify

      # Emit + pack stay in CI, not in `npm run verify`, so local verify stays
      # offline and fast. prepublishOnly is the only other emit gate and cannot
      # run while the package is private. Fail closed on missing dist entry
      # points or a tarball that omits LICENSE / CHANGELOG.md (Shipcheck D5).
      # Print-only dry-run is not a gate. sourceMap/declarationMap files ride
      # with dist/ once they emit.
      - name: Build emit + pack shape
        run: |
          set -euo pipefail
          npm run build
          for f in dist/cli.js dist/index.js dist/index.d.ts dist/cli.js.map dist/index.js.map dist/index.d.ts.map; do
            if [ ! -f "$f" ]; then
              echo "::error::missing $f after npm run build"
              exit 1
            fi
          done
          npm pack --dry-run --json > "${RUNNER_TEMP}/pack.json"
          cat "${RUNNER_TEMP}/pack.json"
          missing=0
          for req in LICENSE CHANGELOG.md; do
            if ! jq -e --arg p "$req" '
              (if type == "array" then .[0] else . end).files
              | map(.path | gsub("\\\\"; "/"))
              | index($p)
            ' "${RUNNER_TEMP}/pack.json" >/dev/null; then
              echo "::error::npm pack omits ${req} (Shipcheck D5)"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      # Two audits, deliberately. The BLOCKING one covers what a consumer of
      # this package is actually exposed to: it ships dist/ with no runtime
      # dependencies (node-pty and @xterm/headless are optional and only the
      # pty driver loads them), so --omit=dev is the honest consumer surface.
      # Keep it blocking. Do not `|| true` / `|| echo` it.
      #
      # The second is advisory: developer-surface vulns that never ship.
      # continue-on-error: true so GitHub paints the step orange and an
      # npm-audit crash (network, arborist) is distinguishable from advisories
      # (`|| echo` would swallow both as a green warning).
      # Live shape: 5 vulnerabilities (3 moderate, 1 high, 1 critical) through
      # vitest → vite → esbuild. Named:
      #   - GHSA-67mh-4wv8-2f99 — esbuild DEV SERVER (does not run here)
      #   - GHSA-82fw-gwwq-j7x9 — vitest @vitest/mocker path traversal
      #   - plus a critical vitest advisory (browser-mode / UI-server class)
      # npm's force-upgrade is a breaking vitest major (4.x on the runner
      # advisory DB, 5.x locally), blocked by npm 10.9.8 arborist's
      # #loadPeerSet ("Cannot read properties of null (reading 'edgesOut')")
      # — not "install vitest 4". vitest 4 cannot be installed on npm 10.9.8.
      # Revisit when npm or vitest moves.
      - name: Audit dependencies (consumer surface — blocking)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit dependencies (developer surface — advisory)
        continue-on-error: true
        run: npm audit --audit-level=high
